name: MLB Trends Daily Scraper

on:
  schedule:
    # 每天台灣時間下午 6:00 (UTC 10:00) 自動在雲端執行抓取
    - cron: '0 10 * * *'
  workflow_dispatch: # 允許您在 GitHub 網頁上手動點擊按鈕，立即強制執行抓取

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 Actions 機器人修改並提交程式碼
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Scraper
        run: |
          python scrape.py
          mv mlb_trends.html index.html

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update MLB trends for $(date +'%Y-%m-%d')" || exit 0
          git push

name: MLB Trends Daily Scraper

on:
  schedule:
    # covers.com 的趨勢約在美東清晨 5~8 點陸續發佈，8 點半左右大致到位。
    # GitHub Actions 排程實測會延遲 2~2.5 小時，故每天排 4 輪並避開整點尖峰：
    # UTC 11:17/12:17/13:17/15:17 = 台灣 19:17/20:17/21:17/23:17。
    # 即使首輪延遲 2.5 小時，台灣 22:00 前也必有當日資料；後續輪次以更完整趨勢刷新。
    - cron: '17 11 * * *'
    - cron: '17 12 * * *'
    - cron: '17 13 * * *'
    - cron: '17 15 * * *'
  workflow_dispatch: # 允許您在 GitHub 網頁上手動點擊按鈕，立即強制執行抓取

# 排程延遲可能導致多輪同時執行，序列化避免同時 push 造成 non-fast-forward 失敗
concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 Actions 機器人修改並提交程式碼
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper
        run: python scrape.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update MLB trends for $(date +'%Y-%m-%d')" || exit 0
          git pull --rebase origin main
          git push

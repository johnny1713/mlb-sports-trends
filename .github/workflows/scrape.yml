name: MLB Trends Daily Scraper

on:
  schedule:
    # covers.com 的趨勢是賽前漸進發佈的，美東太早抓會拿到大量空白趨勢。
    # 每天跑兩次：台灣 21:00 與 23:00 (UTC 13:00 / 15:00 = 美東 9:00 / 11:00)。
    # 第二次用更完整的趨勢刷新，也可補救 GitHub Actions 排程延遲或單次失敗。
    - cron: '0 13 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: # 允許您在 GitHub 網頁上手動點擊按鈕，立即強制執行抓取

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 Actions 機器人修改並提交程式碼
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper
        run: python scrape.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update MLB trends for $(date +'%Y-%m-%d')" || exit 0
          git push

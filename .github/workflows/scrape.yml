name: MLB Trends Daily Scraper

on:
  schedule:
    # covers.com 的趨勢約在美東清晨 5~8 點陸續發佈，8 點半左右大致到位。
    # GitHub Actions 排程實測會延遲 1~2.5 小時，故每天排多輪並避開整點尖峰：
    # UTC 11:17/12:17/13:17/15:17 = 台灣 19:17/20:17/21:17/23:17。
    # 即使首輪延遲 2.5 小時，台灣 22:00 前也必有當日資料；後續輪次以更完整趨勢刷新。
    - cron: '17 11 * * *'
    - cron: '17 12 * * *'
    - cron: '17 13 * * *'
    - cron: '17 15 * * *'
    # 補救輪：2026-08-01 實測 covers 曾延到美東中午 12 點才發佈趨勢，
    # 上面四輪（最晚落在美東 11 點前後）全部撲空。以下兩輪 = 台灣 00:17/01:17，
    # 雖晚於使用者 22:00 的看盤時段，但仍在美東當日開賽前補齊資料。
    - cron: '17 16 * * *'
    - cron: '17 17 * * *'
  workflow_dispatch: # 允許您在 GitHub 網頁上手動點擊按鈕，立即強制執行抓取

# 排程延遲可能導致多輪同時執行，序列化避免同時 push 造成 non-fast-forward 失敗
concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 Actions 機器人修改並提交程式碼
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper
        run: python scrape.py

      - name: Commit and Push Changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "內容與上一輪相同，不產生 commit"
          else
            git commit -m "Auto-update MLB trends for $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pages 的 deploy 步驟會偶發失敗（2026-08-06 實測一天三次有兩次掛掉，build 全過、
      # 只有 Deploy to GitHub Pages 失敗）。單獨一次失敗本來還好，但和「內容沒變就不 commit」
      # 疊在一起會變成無限期卡住：部署失敗後，下一輪若抓到相同內容就不 commit，
      # 也就不會再觸發部署，網站可以一直停在舊頁面而毫無跡象。
      # 因此在「這輪沒有新 commit」時比對線上頁面與剛產出的檔案，對不上就補一個空 commit
      # 逼 Pages 重新部署。這輪有 push 的話不檢查——部署才剛觸發，比一定不會過。
      - name: Verify Deployment
        if: steps.commit.outputs.changed == 'false'
        run: |
          # 加時間戳記查詢字串繞過 Fastly CDN 快取（Pages 的 max-age 是 600 秒）
          if ! curl -fsSL --max-time 30 \
               "https://johnny1713.github.io/mlb-sports-trends/index.html?cachebust=$(date +%s)" \
               -o /tmp/live.html; then
            echo "取不到線上頁面，略過本次檢查"
            exit 0
          fi
          LIVE=$(sha256sum /tmp/live.html | cut -d' ' -f1)
          LOCAL=$(sha256sum index.html | cut -d' ' -f1)
          if [ "$LIVE" = "$LOCAL" ]; then
            echo "線上頁面與最新產出一致（$LOCAL）"
          else
            echo "線上頁面落後於 main：live=$LIVE local=$LOCAL"
            echo "補一個空 commit 觸發 Pages 重新部署"
            git pull --rebase origin main
            git commit --allow-empty -m "Redeploy: Pages 頁面落後於 main（前次部署失敗）"
            git push
          fi

name: MLB Trends Daily Scraper

on:
  schedule:
    # 每天台灣時間晚上 10:00 (UTC 14:00 = 美東早上 10:00) 自動在雲端執行抓取。
    # covers.com 的趨勢是賽前漸進發佈的，美東太早抓會拿到大量空白趨勢。
    - cron: '0 14 * * *'
  workflow_dispatch: # 允許您在 GitHub 網頁上手動點擊按鈕，立即強制執行抓取

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 Actions 機器人修改並提交程式碼
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper
        run: python scrape.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update MLB trends for $(date +'%Y-%m-%d')" || exit 0
          git push
